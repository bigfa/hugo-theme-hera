{{ define "main" }}

<div class="articleContainer">
    <div class="hArticle" data-id="{{ .File.UniqueID}}">
        <header class="hArticle--header">
            <h2 class="hArticle--headline">{{ .Title }}</h2>
            {{ if .Params.description }}
            <div class="hArticle--subline">
                {{ .Params.description }}
            </div>
            {{end}}
        </header>
        <div class="template--linksWrap">
            <ul class="link-items">
                {{ range .Params.links }}
                <li class="link-item">
                    <a class="link-item-inner effect-apollo" href="{{ .link }}" title="Just a blog" target="_blank">
                        <span class="sitename"><strong>{{ .title }}</strong>{{ .description }}</span>
                    </a>
                </li>
                {{ end }}
            </ul>
        </div>
        <div class="grap u-marginBottom30">
            {{ .Content }}
        </div>
    </div>
</div>

{{ end }}
